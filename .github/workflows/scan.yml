# The scan battery -- SEVEN SENSORS, NONE OF THEM BLOCKING.
#
# WHY EVERY JOB HERE IS continue-on-error AND ONE JOB IS NOT
#
#   The scanners measure Mist's decay. A red scan is DATA, not a defect
#   (docs/ROADMAP.md:48). Gating merge on these findings would stop the project
#   recording the very thing it exists to record, and would quietly pressure
#   contributors into adopting mitigations -- standing rule 4's exact failure
#   mode (CONTRIBUTING.md).
#
#   Mist blocks on HONESTY and never on exposure. The blocking jobs are
#   containment.yml (EPIC-01: the wall around the experiment) and ledger.yml
#   (EPIC-08: the record of how it was built). Both are about whether the
#   experiment is being run truthfully. None of them is about whether the tree
#   is clean, because the tree is not supposed to be clean.
#
#   The `assemble` job below is the ONE exception in this file, and it is not an
#   exception to the rule -- it is the rule applied to the instrument. A
#   malformed scan-run.json is a broken measuring device, and a broken device is
#   a real defect. It blocks. The scanners it aggregates do not.
#
# WHAT IS ASLEEP RIGHT NOW
#
#   Five of the seven scanners need a dependency tree, and EPIC-02 has not
#   landed: there is no package.json and no package-lock.json. Those jobs run,
#   detect the absence, and record `status: "skipped"` with a stated reason.
#   They do NOT report zero. Reporting zero transitive packages would be a false
#   green, which is the single most damaging thing this battery could say.
#   When EPIC-02 lands they wake up with no edit to this file.
#
# Owned by EPIC-03. See docs/SCANNERS.md for what each sensor cannot see.

name: scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned, because EPIC-07 compares runs across months and an unversioned
  # finding is not comparable to anything.
  OSV_SCANNER_VERSION: "1.9.2"
  GITLEAKS_VERSION: "8.21.2"
  SEMGREP_VERSION: "1.90.0"

jobs:
  # --- known-CVE baseline (EPIC-03 Phase 1) ----------------------------------

  audit:
    name: npm audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: npm audit
        run: |
          if [ ! -f package-lock.json ]; then
            export MIST_SKIP_REASON="no package-lock.json: EPIC-02 has not landed, so there is no tree to audit"
            bash scripts/scan-step.sh npm-audit build/raw
          else
            export MIST_TOOL_VERSION="$(npm --version)"
            # --audit-level=none: report everything, decide nothing.
            bash scripts/scan-step.sh npm-audit build/raw -- npm audit --json --audit-level=none
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-npm-audit
          path: build/raw/npm-audit*

  osv:
    name: osv-scanner (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install osv-scanner
        run: |
          curl -fsSL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
      - name: osv-scanner
        run: |
          if [ ! -f package-lock.json ]; then
            export MIST_SKIP_REASON="no package-lock.json: EPIC-02 has not landed"
            bash scripts/scan-step.sh osv-scanner build/raw
          else
            export MIST_TOOL_VERSION="$(/tmp/osv-scanner --version 2>&1 | head -1)"
            bash scripts/scan-step.sh osv-scanner build/raw -- /tmp/osv-scanner --format json --lockfile package-lock.json
          fi
      - name: propose denylist additions
        # Phase 1d. PROPOSES ONLY. deploy/advisory-denylist.txt is an input to a
        # BLOCKING gate; a non-blocking scan job must not be able to rewrite what
        # blocks merge. A human copies the additions across.
        run: node scripts/refresh-denylist.mjs --osv build/raw/osv-scanner.json --out build/advisory-denylist.proposed.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-osv-scanner
          path: |
            build/raw/osv-scanner*
            build/advisory-denylist.proposed.txt

  # --- behavioral SCA: the interesting layer (EPIC-03 Phase 2) ---------------

  sca:
    name: behavioral SCA (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install the tree
        # The analyser reads package manifests and entry points off disk, so the
        # tree must exist. Install scripts stay ENABLED: --ignore-scripts here
        # would hide the exact behaviour this job measures.
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; fi

      - name: behavioral SCA
        # This is the layer that detects ANTI-KERNEL PROPERTIES rather than known
        # bugs: install scripts, network at install and import, obfuscation,
        # maintainer changes (docs/mist-concept-evaluation.md:54). It is the
        # primary input to the Mist Index (EPIC-06).
        #
        # THE TOOL IS scripts/sca-static.mjs, WHICH IS NOT SOCKET AND NOT A
        # BEHAVIOURAL SCA. Socket -- the tool EPIC-03 names -- needs an API
        # token, which needs an account, which needs a human. That is still owed.
        # This is a static text-matching approximation whose network-at-import
        # figure is an UPPER BOUND, documented as such in docs/SCANNERS.md and in
        # the script's own header. It exists so A3 has a real number instead of
        # `not-measured`, not so the gap can be declared closed.
        #
        # --maintainers is deliberately omitted here: it makes one npm registry
        # request per package name, which is slow and flaky in CI. The field is
        # then reported as NOT MEASURED rather than as 0.
        run: |
          if [ ! -d node_modules ]; then
            export MIST_SKIP_REASON="no node_modules: nothing to analyse"
            bash scripts/scan-step.sh sca-behavioral build/raw
          else
            export MIST_TOOL_VERSION="sca-static (static approximation; Socket still owed)"
            bash scripts/scan-step.sh sca-behavioral build/raw -- node scripts/sca-static.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-sca-behavioral
          path: build/raw/sca-behavioral*

  # --- first-party SAST and secrets (EPIC-03 Phase 3) -----------------------

  semgrep:
    name: semgrep (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install semgrep
        run: pip install --quiet "semgrep==${SEMGREP_VERSION}"
      - name: semgrep
        # FIRST-PARTY PATHS ONLY. Running SAST over node_modules produces noise
        # that swamps the honest dozen and makes the first/second-party split
        # unreadable. Second-party exposure is measured by the SCA and audit
        # layers, which are the right instruments for it.
        #
        # No .semgrepignore. Default rulesets only. Findings are not fixed just
        # to make the dashboard look better (EPIC-00 Scope rule 4).
        run: |
          TARGETS=""
          for d in apps scripts; do [ -d "$d" ] && TARGETS="$TARGETS $d"; done
          if [ -z "$TARGETS" ]; then
            export MIST_SKIP_REASON="no first-party source directories on disk yet (apps/ arrives with EPIC-02)"
            bash scripts/scan-step.sh semgrep build/raw
          else
            export MIST_TOOL_VERSION="$(semgrep --version)"
            bash scripts/scan-step.sh semgrep build/raw -- \
              semgrep scan --config=auto --json --no-git-ignore --exclude=node_modules $TARGETS
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-semgrep
          path: build/raw/semgrep*

  gitleaks:
    name: gitleaks (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, NOT NEGOTIABLE. K1 lives in history and is never
          # scrubbed (docs/KEY_ROTATION.md step 6). A shallow clone would miss
          # it and this scanner would report a FALSE GREEN -- the one failure
          # mode that would actually damage the argument.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: generate the ruleset
        # From schemas/secret-patterns.json -- the ONE secret ruleset in this
        # repository. Generated into build/, never committed: a committed
        # .gitleaks.toml is what the no-suppression assertion forbids, because
        # the usual reason to have one is to allowlist findings away. Additive
        # only: gitleaks' own defaults stay on.
        run: node scripts/gen-gitleaks-config.mjs --out build/gitleaks.mist.toml
      - name: gitleaks
        run: |
          export MIST_TOOL_VERSION="$(/tmp/gitleaks version 2>&1 | head -1)"
          bash scripts/scan-step.sh gitleaks build/raw -- \
            /tmp/gitleaks detect --config build/gitleaks.mist.toml --log-opts= \
              --report-format json --report-path /dev/stdout --no-banner --redact=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # NOTE: this artifact contains matched secret material by construction
          # -- that is what a secret scanner returns. It is acceptable only
          # because every key it can find here is deliberately committed and
          # already revoked (K1, docs/KEY_ROTATION.md). The normalized
          # scan-run.json carries File:StartLine and the rule id, never the
          # secret; scripts/test-scan.mjs asserts that.
          name: raw-gitleaks
          path: build/raw/gitleaks*

  # --- surface accounting (EPIC-03 Phase 4) ---------------------------------

  sbom:
    name: SBOM + surface delta (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: CycloneDX SBOM
        run: |
          if [ ! -f package-lock.json ]; then
            export MIST_SKIP_REASON="no package-lock.json: EPIC-02 has not landed, so there is no surface to enumerate"
            bash scripts/scan-step.sh sbom build/raw
          else
            export MIST_TOOL_VERSION="$(npx --yes @cyclonedx/cyclonedx-npm --version 2>&1 | tail -1)"
            bash scripts/scan-step.sh sbom build/raw -- npx --yes @cyclonedx/cyclonedx-npm --output-format JSON
          fi
      - name: surface delta vs base
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "No lockfile on either side yet; nothing to diff." > build/sbom-delta.md
          else
            git checkout -q "origin/${{ github.base_ref }}" -- package-lock.json package.json 2>/dev/null || true
            bash scripts/scan-step.sh sbom-base build/base -- npx --yes @cyclonedx/cyclonedx-npm --output-format JSON
            git checkout -q HEAD -- package-lock.json package.json 2>/dev/null || true
            node scripts/sbom-diff.mjs --base build/base/sbom-base.json --head build/raw/sbom.json --markdown > build/sbom-delta.md
          fi
          cat build/sbom-delta.md >> "$GITHUB_STEP_SUMMARY"
      - name: comment the surface delta
        # Best-effort. A pull_request from a fork gets no pull-requests: write
        # token, so the step summary above is the path that always works.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('build/sbom-delta.md')) return;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('build/sbom-delta.md', 'utf8'),
            });
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-sbom
          path: |
            build/raw/sbom*
            build/sbom-delta.md

  licenses:
    name: license inventory (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: license inventory
        # OBLIGATION CLASSES, NOT BARE SPDX IDS. "Obligations nobody read,
        # accumulating in the same tree" (docs/mist-concept-evaluation.md:58).
        # A list of identifiers is not a cost; a count of copyleft and
        # unknown-licence packages is.
        run: |
          if [ ! -f package-lock.json ]; then
            export MIST_SKIP_REASON="no package-lock.json: EPIC-02 has not landed"
            bash scripts/scan-step.sh licenses build/raw
          else
            export MIST_TOOL_VERSION="$(node --version)"
            bash scripts/scan-step.sh licenses build/raw -- node scripts/license-inventory.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-licenses
          path: build/raw/licenses*

  # --- assembly (EPIC-03 Phase 5) -------------------------------------------

  assemble:
    name: assemble scan-run.json (blocks only on a broken instrument)
    runs-on: ubuntu-latest
    needs: [audit, osv, sca, semgrep, gitleaks, sbom, licenses]
    # if: always() -- a crashed scanner must still yield an envelope with its
    # non-zero exitCode recorded. An absent envelope tells the dashboard nothing;
    # an envelope saying "semgrep crashed" tells it the truth.
    if: always()
    # DELIBERATELY NOT continue-on-error. This is the instrument, not the
    # measurement. See the file header.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          path: build/artifacts
      - name: collect raw output
        run: |
          mkdir -p build/raw
          find build/artifacts -type f -name '*.json' -exec cp {} build/raw/ \; 2>/dev/null || true
          ls -la build/raw
      - name: assemble
        run: node scripts/assemble-scan-run.mjs --raw build/raw --out scan-run.json
      - name: check-scan
        run: node scripts/check-scan.mjs
      - name: test-scan
        run: node scripts/test-scan.mjs
      - name: summary
        run: |
          {
            echo '### scan-run.json'
            echo '```'
            node -e '
              const e = JSON.parse(require("fs").readFileSync("scan-run.json","utf8"));
              for (const s of e.scanners)
                console.log(`${s.id.padEnd(16)} ${s.status.padEnd(8)} ${String(s.findings.length).padStart(3)} finding(s)${s.skipReason ? "  -- " + s.skipReason : ""}`);
            '
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: mist index (EPIC-06, non-blocking)
        # Read-only over the artifacts above. It scores what it can and says so
        # when it cannot -- today three of five axes have no instrument, so it
        # prints NOT COMPUTABLE rather than a renormalised number.
        continue-on-error: true
        run: |
          {
            echo '### Mist Index'
            echo '```'
            node tools/mist-index/bin/mist-index.mjs . || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          node tools/mist-index/bin/mist-index.mjs . --json > mist-index.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: scan-run
          path: |
            scan-run.json
            mist-index.json
